<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Taskify — Join Us</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
	<div class="landing-glow"></div>

	<div class="auth-container">
		<a href="index.html" class="auth-back">&larr; Back to home</a>
		
		<div class="auth-card animate-slide-up">
			<div class="auth-tabs">
				<button id="loginTab" class="auth-tab active">Login</button>
				<button id="signupTab" class="auth-tab">Sign Up</button>
			</div>

			<!-- Form Error Display -->
			<div id="authError" class="auth-error-box hidden">
				<span class="error-emoji">⚠️</span>
				<span id="authErrorMsg">An error occurred</span>
			</div>

			<!-- Login Form -->
			<form id="loginForm" class="auth-form">
				<h2>Welcome Back</h2>
				<p class="auth-lead">Sign in to resume tracking your goals.</p>
				
				<div class="form-group">
					<label for="loginEmail">Email Address</label>
					<input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
				</div>
				<div class="form-group">
					<label for="loginPassword">Password</label>
					<input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
				</div>
				
				<button type="submit" class="btn-auth-submit">Sign In</button>
			</form>

			<!-- Signup Form -->
			<form id="signupForm" class="auth-form hidden">
				<h2>Create Account</h2>
				<p class="auth-lead">Start managing your tasks beautifully today.</p>
				
				<div class="form-group">
					<label for="signupUsername">Username</label>
					<input type="text" id="signupUsername" placeholder="alex" required autocomplete="username" />
				</div>
				<div class="form-group">
					<label for="signupEmail">Email Address</label>
					<input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />
				</div>
				<div class="form-group">
					<label for="signupPassword">Password</label>
					<input type="password" id="signupPassword" placeholder="Minimum 6 characters" required autocomplete="new-password" />
				</div>
				
				<button type="submit" class="btn-auth-submit">Sign Up</button>
			</form>
		</div>
	</div>

	<script src="auth.js"></script>
</body>
</html>
