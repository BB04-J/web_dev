<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG-ColourChanger</title>
    <link rel="stylesheet" href="bg-change.css">
</head>

<body>
    <div class="container">
        <button id="togglebtn">☰</button>
        <div class="sidebar" id="sidebar">
            <div class="content">
                <div id="color-panel"></div>
                <button id="openPopup">+ Colours</button>
            </div>
        </div>
        <div class="popup" id="popup">
            <h3>Select Custom Color</h3>
            <label for="colorPicker">Choose Color:</label>
            <input type="color" id="colorPicker">
            <input type="text" id="colorName" placeholder="Enter a color name">
            <button id="previewColor">Preview</button>
            <button id="addColor">Add Color</button>
            <button id="cancel">Cancel</button>
        </div>
        <div class="main">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
